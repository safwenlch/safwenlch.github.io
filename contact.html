<main>
<h1>Contact</h1>
<p class="lead">Écris-moi : le message arrive directement dans ma boîte mail.</p>
<form id="contact" novalidate>
<input type="hidden" name="access_key" value="5d6b4967-ea6b-4151-acdc-26d9016ea0ee">
<input type="hidden" name="subject" value="Message depuis mon portfolio">
<input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off">
<p><label for="prenom">Prénom</label><input id="prenom" name="name" type="text" autocomplete="given-name" required aria-describedby="e-prenom"><small class="err" id="e-prenom"></small></p>
<p><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="e-email"><small class="err" id="e-email"></small></p>
<p><label for="tel">Téléphone (facultatif)</label><input id="tel" name="phone" type="tel" autocomplete="tel" aria-describedby="e-tel"><small class="err" id="e-tel"></small></p>
<p><label for="msg">Message</label><textarea id="msg" name="message" rows="6" required aria-describedby="e-msg"></textarea><small class="err" id="e-msg"></small></p>
<button class="btn solid" type="submit">Envoyer le message</button>
<p id="statut" role="status"></p>
</form>
